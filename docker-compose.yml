services:
  apexdb:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PATH: /data/apex.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APEX_BOOTSTRAP_ADMIN_PASSWORD: ${APEX_BOOTSTRAP_ADMIN_PASSWORD:?APEX_BOOTSTRAP_ADMIN_PASSWORD is required}
      REPLICATION_SECRET: ${REPLICATION_SECRET:?REPLICATION_SECRET is required}
      REPLICA_MODE: leader
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
    volumes:
      - apex-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    user: "1000:1000"
    init: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  apex-data:
